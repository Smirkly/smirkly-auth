name: CI

'on':
    schedule:
      - cron: '30 5 * * 1'  # Every Monday at 5:30
    pull_request:
    push:
        branches:
          - develop

env:
    UBSAN_OPTIONS: print_stacktrace=1
    NPROCS: 2

jobs:
    quality:
        name: Contract and formatting
        runs-on: ubuntu-24.04
        steps:
          - uses: actions/checkout@v4
            with:
                fetch-depth: 0

          - name: Install quality tools
            run: |
                sudo apt update
                sudo apt install --yes clang-format python3-pip
                python3 -m pip install --break-system-packages \
                    PyYAML==6.0.3 \
                    openapi-spec-validator==0.7.2

          - name: Check changed C++ formatting
            env:
                PR_BASE_SHA: '${{github.event.pull_request.base.sha}}'
                PUSH_BASE_SHA: '${{github.event.before}}'
            run: |
                base="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
                if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
                    base="$(git rev-parse HEAD^)"
                fi

                mapfile -t files < <(
                    git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.cpp' '*.hpp'
                )
                if ((${#files[@]})); then
                    clang-format --dry-run --Werror "${files[@]}"
                fi

          - name: Validate Python and YAML
            run: |
                python3 -m compileall -q tests
                python3 - <<'PY'
                from pathlib import Path
                import yaml

                for path in [
                    *Path("configs").glob("*.yaml"),
                    *Path(".github/workflows").glob("*.yml"),
                    Path("docker-compose.yml"),
                    Path("docker-compose.devcontainer.yml"),
                ]:
                    yaml.safe_load(path.read_text())
                PY

          - name: Validate OpenAPI
            run: |
                python3 - <<'PY'
                from pathlib import Path
                import yaml
                from openapi_spec_validator import validate_spec

                validate_spec(yaml.safe_load(Path("openapi/auth-v0.yaml").read_text()))
                PY

    posix:
        needs: quality
        env:
          USERVER_ENABLE_STACK_USAGE_MONITOR: '0'
        strategy:
            fail-fast: false
            matrix:
                include:
                  - os: ubuntu-24.04
                    make: test-debug
                    info: Debug + ASan/UBSan

                  - os: ubuntu-24.04
                    make: test-release
                    info: Release

        name: '${{matrix.os}}: ${{matrix.info}}'
        runs-on: ${{matrix.os}}

        steps:
          - uses: actions/checkout@v4
            with:
                submodules: true

          - name: Reuse ccache directory
            uses: actions/cache@v4
            with:
                path: ~/.cache/ccache
                key: '${{matrix.os}} ${{matrix.info}} ccache-dir ${{github.ref}} run-${{github.run_number}}'
                restore-keys: |
                    ${{matrix.os}} ${{matrix.info}} ccache-dir ${{github.ref}} run-'
                    ${{matrix.os}} ${{matrix.info}} ccache-

          - name: Install packages
            run: |
                DEPS_FILE="https://raw.githubusercontent.com/userver-framework/userver/refs/tags/v3.0/scripts/docs/en/deps/${{matrix.os}}.md"
                sudo apt update
                sudo apt install --allow-downgrades -y $(wget -q -O - ${DEPS_FILE})
                python3 -m pip install -r requirements.txt

          - name: Setup ccache
            run: |
                ccache -M 2.0GB
                ccache -s

          - name: Run ${{matrix.make}}
            run: |
                make ${{matrix.make}}

          - name: Assert functional testsuite gate
            if: matrix.make == 'test-debug'
            run: |
                ctest --test-dir build-debug -N | grep testsuite-smirkly-auth-functional

    migrations:
        name: Migration round trip
        needs: quality
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: auth_migrations
                    POSTGRES_USER: smirkly_auth
                    POSTGRES_PASSWORD: smirkly_auth
                ports:
                  - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U smirkly_auth -d auth_migrations"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20
        steps:
          - uses: actions/checkout@v4

          - name: Apply, roll back, and reapply migrations
            env:
                DATABASE_URL: postgres://smirkly_auth:smirkly_auth@127.0.0.1:5432/auth_migrations?sslmode=disable
            run: |
                run_migrate() {
                    docker run --rm --network host \
                        -v "$PWD/migrations:/migrations:ro" \
                        migrate/migrate:v4.19.1 \
                        -path=/migrations -database="$DATABASE_URL" "$@"
                }

                run_migrate up
                run_migrate down -all
                run_migrate up

    production-image:
        name: Production image
        needs: quality
        runs-on: ubuntu-24.04
        steps:
          - uses: actions/checkout@v4
            with:
                submodules: true

          - name: Build production target
            run: |
                docker build --platform linux/amd64 --target prod \
                    --tag smirkly-auth:ci .

          - name: Assert non-root runtime
            run: |
                test "$(docker inspect --format '{{.Config.User}}' smirkly-auth:ci)" = "smirkly-auth"
                docker run --rm --entrypoint /bin/sh smirkly-auth:ci -c \
                    'test "$(id -u)" = 10001 && test -w /var/cache/smirkly-auth'
